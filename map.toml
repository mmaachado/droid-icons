# freedesktop icon name → Material Symbols name (https://fonts.google.com/icons).
#
# [plain.<context>]     written as name-symbolic.svg and name.svg
# [symbolic.<context>]  written as name-symbolic.svg only, so apps asking
#                       for the plain name keep Tela-circle's icon
# [levels.<series>]     numbered series (see expand_levels in build.py)
#
# A value can be a list of fallbacks; "symbol@0" is the outlined variant.

